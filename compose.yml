services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: inventory
      MYSQL_USER: inventory
      MYSQL_PASSWORD: inventory
      MYSQL_ROOT_PASSWORD: local-root-password
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "inventory", "-pinventory"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: .
    environment:
      DB_URL: jdbc:mysql://mysql:3306/inventory
      DB_USERNAME: inventory
      DB_PASSWORD: inventory
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql-data:
